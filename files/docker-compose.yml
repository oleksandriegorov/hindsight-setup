services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: hindsight
    restart: unless-stopped
    shm_size: 1g   # PostgreSQL needs >500 MB shared memory; the 64 MB Docker default breaks new banks and reflect
    env_file:
      - ${HOME}/.hindsight/hindsight.env   # provider settings; Anthropic key kept commented for rollback
    environment:
      HINDSIGHT_API_LLM_PROVIDER: openai-codex
      HINDSIGHT_API_LLM_MODEL: gpt-5.6-luna
      HINDSIGHT_API_WORKER_ID: macbook-local
      HINDSIGHT_API_LLM_CODEX_HOME: /home/hindsight/.codex   # dedicated ChatGPT login, not the Codex CLI one
      # Retain: high-volume fact extraction; Luna 5.6 on low ranks first in the Hindsight retain benchmark
      HINDSIGHT_API_RETAIN_LLM_REASONING_EFFORT: low
      # Consolidation and reflect: fewer calls, more judgment
      HINDSIGHT_API_CONSOLIDATION_LLM_PROVIDER: openai-codex
      HINDSIGHT_API_CONSOLIDATION_LLM_MODEL: gpt-6-luna
      HINDSIGHT_API_CONSOLIDATION_LLM_REASONING_EFFORT: medium
      HINDSIGHT_API_REFLECT_LLM_PROVIDER: openai-codex
      HINDSIGHT_API_REFLECT_LLM_MODEL: gpt-6-luna
      HINDSIGHT_API_REFLECT_LLM_REASONING_EFFORT: medium
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:9999:9999"
    volumes:
      - hindsight-data:/home/hindsight/.pg0
      - ${HOME}/.hindsight/codex:/home/hindsight/.codex   # read-write: tokens rotate on refresh
    logging:
      driver: local

volumes:
  hindsight-data:
    external: true   # reuse the existing volume so memories are kept
