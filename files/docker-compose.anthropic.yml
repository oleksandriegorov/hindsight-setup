services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: hindsight
    restart: unless-stopped
    shm_size: 1g   # PostgreSQL needs >500 MB shared memory; the 64 MB Docker default breaks new banks and reflect
    env_file:
      - ${HOME}/.hindsight/hindsight.env   # provider, model and API key (chmod 600)
    environment:
      HINDSIGHT_API_WORKER_ID: macbook-local
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:9999:9999"
    volumes:
      - hindsight-data:/home/hindsight/.pg0
    logging:
      driver: local

volumes:
  hindsight-data:
    external: true   # reuse the existing volume so memories are kept
